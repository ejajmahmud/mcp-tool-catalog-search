[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-catalog-search"
version = "0.1.0"
description = "In-memory BM25 index over MCP tool descriptions enabling sub-millisecond semantic tool discovery for agents with 100+ tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-tool-catalog-search = "mcp_tool_catalog_search.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_tool_catalog_search*"]
